name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential

      - name: Configure
        run: cmake -H. -B_build -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build _build

      - name: Run tests
        run: ctest --test-dir _build --output-on-failure

  coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential lcov

      - name: Configure with coverage
        run: cmake -H. -B_build -DBUILD_TESTS=ON -DCOVERAGE=ON

      - name: Build
        run: cmake --build _build

      - name: Run tests
        run: ctest --test-dir _build --output-on-failure

      - name: Collect coverage
        run: |
          lcov --capture --directory _build --output-file coverage.info \
               --rc lcov_branch_coverage=0 --gcov-tool gcov
          lcov --extract coverage.info '*/banking/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.info
          format: lcov
